name: Build TR3000 112m NMBM

on:
  workflow_dispatch:
    inputs:
      include_daed:
        description: "可选：预装 daed 和 LuCI 界面（不勾选也保留 eBPF 内核和模块）"
        type: boolean
        default: false
      extra_packages:
        description: "额外软件包，以空格分隔；默认已含 WireGuard、Android USB 共享、软件包管理中文"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: tr3000-112m-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      SOURCE_REF: v25.12.1
      INCLUDE_DAED: ${{ inputs.include_daed }}
      EXTRA_PACKAGES: ${{ inputs.extra_packages }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang llvm lld flex bison g++ gawk gcc-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            rsync swig unzip zlib1g-dev file wget curl zstd device-tree-compiler squashfs-tools
          df -h .

      - name: Fetch source and apply stock NMBM 112m adaptation
        run: |
          git clone --depth 1 --branch "$SOURCE_REF" https://github.com/immortalwrt/immortalwrt.git source
          python3 tr3000-112m/prepare.py source
          mkdir -p output
          git -C source rev-parse HEAD > output/source-commit.txt
          git -C source diff > output/112m-source.patch
          cp tr3000-112m/README.md output/README-112m.md

      - name: Configure kernel, packages and dedicated ImageBuilder
        working-directory: source
        run: |
          ./scripts/feeds update -a
          if [ "$INCLUDE_DAED" = true ]; then
            python3 ../tr3000-112m/customize.py package .
          fi
          ./scripts/feeds install -a
          printf '%s\n' \
            CONFIG_TARGET_mediatek=y \
            CONFIG_TARGET_mediatek_filogic=y \
            CONFIG_TARGET_MULTI_PROFILE=y \
            CONFIG_TARGET_mediatek_filogic_DEVICE_cudy_tr3000-v1=y \
            CONFIG_TARGET_PER_DEVICE_ROOTFS=y \
            CONFIG_DEVEL=y \
            CONFIG_BPF_TOOLCHAIN_HOST=y \
            CONFIG_KERNEL_DEBUG_INFO=y \
            '# CONFIG_KERNEL_DEBUG_INFO_REDUCED is not set' \
            CONFIG_KERNEL_DEBUG_INFO_BTF=y \
            CONFIG_KERNEL_BPF_EVENTS=y \
            CONFIG_KERNEL_CGROUPS=y \
            CONFIG_KERNEL_CGROUP_BPF=y \
            CONFIG_IB=y > .config
          # Resolve target/toolchain dependencies before selecting feed packages.
          make defconfig
          for symbol in TARGET_mediatek_filogic_DEVICE_cudy_tr3000-v1 HAS_BPF_TOOLCHAIN USE_LLVM_HOST KERNEL_DEBUG_INFO_BTF KERNEL_BPF_EVENTS KERNEL_CGROUP_BPF; do
            grep -qxF "CONFIG_${symbol}=y" .config || {
              cp .config ../output/source.config
              echo "Required target/eBPF configuration not enabled: $symbol"; exit 1;
            }
          done
          clang --version
          llvm-strip --version
          packages="luci luci-i18n-base-zh-cn luci-i18n-package-manager-zh-cn kmod-wireguard wireguard-tools luci-proto-wireguard kmod-usb-net-rndis kmod-usb-net-cdc-ether kmod-usb-net-cdc-ncm"
          # Ship runtime modules even when no dae/daed application is installed.
          # Later installation must not require ABI-incompatible public kmods.
          packages="$packages kmod-sched-core kmod-sched-bpf kmod-xdp-sockets-diag kmod-veth"
          if [ "$INCLUDE_DAED" = true ]; then
            packages="$packages daed luci-app-daed luci-i18n-daed-zh-cn"
          fi
          packages="$packages $EXTRA_PACKAGES"
          # Reject shell/config metacharacters and unavailable package names.
          for package in $packages; do
            [[ "$package" =~ ^[a-zA-Z0-9][a-zA-Z0-9+_.-]*$ ]] || exit 1
            printf 'CONFIG_PACKAGE_%s=m\n' "$package" >> .config
          done
          make defconfig
          # Save diagnostics even if Kconfig drops a requested package.
          cp .config ../output/source.config
          cp tmp/.config-package.in ../output/config-package.in
          cp feeds/packages/net/daed/Makefile ../output/daed-Makefile
          for package in $packages; do
            grep -qxF -e "CONFIG_PACKAGE_${package}=m" -e "CONFIG_PACKAGE_${package}=y" .config || {
              echo "Package missing or disabled by dependencies: $package"
              grep -A 25 -F "config PACKAGE_${package}" tmp/.config-package.in || true
              exit 1
            }
          done
          printf '%s\n' "$packages" > ../output/packages.txt
          cp .config ../output/source.config
          ./scripts/feeds list -s > ../output/feeds.txt

      - name: Build dedicated kernel and ImageBuilder
        working-directory: source
        run: |
          set -o pipefail
          make download -j4
          make -j2 V=s 2>&1 | tee ../output/build.log

      - name: Verify compiled DTB before packaging
        run: |
          dtb=$(find source/build_dir -type f -name '*mt7981b-cudy-tr3000-v1.dtb' -print -quit)
          test -n "$dtb"
          node=/soc/spi@1100a000/flash@0
          fdtget "$dtb" "$node" mediatek,nmbm
          test "$(fdtget -t x "$dtb" "$node/partitions/partition@5c0000" reg)" = '5c0000 7000000'
          cp "$dtb" output/tr3000-112m.dtb

      - name: Build customized image using the new ImageBuilder
        run: |
          builder=$(find source/bin/targets/mediatek/filogic -maxdepth 1 -name '*imagebuilder*.tar.*' -print -quit)
          test -n "$builder"
          mkdir builder
          tar -xf "$builder" -C builder --strip-components=1
          cp "$builder" output/
          python3 tr3000-112m/customize.py files image-files
          packages=$(cat output/packages.txt)
          make -C builder image PROFILE=cudy_tr3000-v1 PACKAGES="$packages" FILES="$GITHUB_WORKSPACE/image-files"
          target_dir=builder/bin/targets/mediatek/filogic
          # Preserve completed images even if a post-build check fails.
          find "$target_dir" -maxdepth 1 -type f -exec cp -t output/ {} +
          # Source builds need not enable CONFIG_VERSION_FILENAMES.
          mapfile -t manifests < <(find "$target_dir" -maxdepth 1 -type f -name '*-cudy_tr3000-v1.manifest')
          if [ "${#manifests[@]}" -ne 1 ]; then
            echo "Expected one TR3000 manifest; available output files:"
            ls -lah "$target_dir"
            exit 1
          fi
          manifest=${manifests[0]}
          if [ ! -s "$manifest" ]; then
            echo "Empty firmware manifest: $manifest"; exit 1
          fi
          echo "Checking final packages in $manifest"
          for package in $packages; do
            awk -v wanted="$package" '$1 == wanted { found=1 } END { exit !found }' "$manifest" || {
              echo "Required package missing from final firmware: $package"; exit 1;
            }
          done
          if [ "$INCLUDE_DAED" = true ]; then
            awk '$1 == "daed" && $3 == "2.1.1-r1" { found=1 } END { exit !found }' "$manifest" || {
              echo "Final image must contain daed 2.1.1-r1, not the old feed package"; exit 1;
            }
          else
            if awk '$1 == "daed" || $1 == "luci-app-daed" { found=1 } END { exit !found }' "$manifest"; then
              echo "daed unexpectedly included; enable its explicit workflow option to preinstall it"
              exit 1
            fi
          fi
          cp image-files/etc/apk/repositories.d/distfeeds.list output/firmware-distfeeds.list
          cp tr3000-112m/daed/Makefile output/daed-release-recipe.Makefile
          # Keep the stock compatibility ID; distinguish the layout in the filename.
          for image in output/*-cudy_tr3000-v1-squashfs-sysupgrade.bin; do
            test -f "$image"
            mv "$image" "${image%-squashfs-sysupgrade.bin}-112m-nmbm-squashfs-sysupgrade.bin"
          done
          for image in output/*112m-nmbm-squashfs-sysupgrade.bin; do
            python3 tr3000-112m/verify-image.py "$image" \
              --unsquashfs /usr/bin/unsquashfs \
              --feeds image-files/etc/apk/repositories.d/distfeeds.list \
              --include-daed "$INCLUDE_DAED"
          done
          cd output
          sha256sum *112m-nmbm-squashfs-sysupgrade.bin > SHA256SUMS-112m

      - name: Upload firmware, reusable ImageBuilder and build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tr3000-112m-nmbm-${{ github.run_number }}
          path: output/
          retention-days: 14
